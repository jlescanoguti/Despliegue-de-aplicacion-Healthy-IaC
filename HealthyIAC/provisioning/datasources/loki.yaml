apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      derivedFields:
        - name: container
          matcherRegex: '"container_name":"([^"]+)"'
          url: 'http://localhost:3000/explore?left=["now-5m","now","Loki",{"expr":"{container_name=\\"$1\\"}"}]'
