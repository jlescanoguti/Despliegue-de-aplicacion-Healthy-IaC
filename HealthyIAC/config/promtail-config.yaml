server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: debug

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: healthy-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: healthy-logs
          __path__: /var/log/test.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            app: app
            memory_percent: memory_percent
            cpu_percent: cpu_percent
      - timestamp:
          source: timestamp
          format: RFC3339